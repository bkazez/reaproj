[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reaproj"
version = "0.1.0"
description = "Parse and edit REAPER .RPP project files: tracks, items, markers, regions, and render settings as Python objects"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Ben Kazez" }]
dependencies = ["rpp>=0.4"]
keywords = ["reaper", "rpp", "reaper-project", "daw", "audio", "music", "parser", "render", "regions"]

[project.urls]
Homepage = "https://github.com/bkazez/reaproj"

[tool.pytest.ini_options]
testpaths = ["tests"]
